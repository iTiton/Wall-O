<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wall-O</title>
  <link rel="icon" href="estatico/icono.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="estatico/icono.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Wall-O" />
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
  <script>
    try {
      const t = localStorage.getItem("wallo-tema");
      if (t === "claro" || t === "oscuro") document.documentElement.dataset.tema = t;
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="estatico/estilos.css" />
</head>
<body>
  <header class="cabecera">
    <div class="marca">
      <img src="estatico/icono.svg" alt="" width="36" height="36" />
      <div>
        <h1>Wall-O</h1>
        <p id="resumen" class="suave">Cargando…</p>
      </div>
    </div>
    <div class="tema" role="group" aria-label="Tema">
      <button data-tema="claro" title="Claro" aria-label="Tema claro">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button data-tema="oscuro" title="Oscuro" aria-label="Tema oscuro">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button data-tema="sistema" title="Como el sistema" aria-label="Tema del sistema">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div id="aviso" class="aviso" hidden></div>
    <section id="lista" class="rejilla" aria-live="polite"></section>
    <section id="vacio" class="vacio" hidden>
      <h2>Aún no hay herramientas</h2>
      <p class="suave">Añade a un contenedor las etiquetas <code>wallo.activar=true</code> y <code>wallo.puerto=8101</code> y aparecerá aquí sola.
        Consulta la guía en el README de Wall-O.</p>
    </section>
  </main>

  <footer class="pie suave">
    <span id="memoria-portal"></span>
    <span>Las herramientas se duermen solas cuando no se usan y se despiertan al abrirlas.</span>
  </footer>

  <template id="plantilla">
    <article class="tarjeta">
      <div class="fila">
        <div class="icono" aria-hidden="true"></div>
        <div class="titulo">
          <h2><span class="nombre"></span> <span class="version suave"></span></h2>
          <p class="descripcion suave"></p>
        </div>
        <span class="estado"><i></i><span></span></span>
      </div>
      <dl class="datos">
        <div><dt>Memoria</dt><dd class="memoria"></dd></div>
        <div><dt>Se duerme</dt><dd class="dormir"></dd></div>
        <div><dt>Puerto</dt><dd class="puerto"></dd></div>
      </dl>
      <p class="error" hidden></p>
      <div class="acciones">
        <a class="boton principal abrir">Abrir</a>
        <button class="boton secundario conmutar"></button>
      </div>
    </article>
  </template>

  <script src="estatico/app.js"></script>
</body>
</html>
