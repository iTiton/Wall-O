<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Despertando {{nombre}}…</title>
  <style>
    :root { --fondo: #f6f7f9; --texto: #18181b; --suave: #71717a; --acento: #0d9488; --tarjeta: #fff; --borde: #e4e4e7; }
    @media (prefers-color-scheme: dark) {
      :root { --fondo: #0b0f14; --texto: #f4f4f5; --suave: #a1a1aa; --acento: #2dd4bf; --tarjeta: #151a21; --borde: #27303a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--fondo); color: var(--texto); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .caja { width: 100%; max-width: 380px; text-align: center; background: var(--tarjeta); border: 1px solid var(--borde);
            border-radius: 20px; padding: 32px 24px; }
    .giro { width: 44px; height: 44px; margin: 0 auto 20px; border-radius: 50%;
            border: 4px solid var(--borde); border-top-color: var(--acento); animation: g 0.9s linear infinite; }
    @keyframes g { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .giro { animation-duration: 3s; } }
    h1 { font-size: 1.15rem; margin: 0 0 6px; }
    p { margin: 0; color: var(--suave); font-size: 0.9rem; }
    .error { color: #dc2626; margin-top: 14px; display: none; }
    button { margin-top: 16px; display: none; border: 0; border-radius: 12px; padding: 10px 18px; font: inherit;
             background: var(--acento); color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main class="caja" role="status" aria-live="polite">
    <div class="giro" aria-hidden="true"></div>
    <h1>Despertando {{nombre}}…</h1>
    <p id="texto">Estaba dormida para no gastar memoria. Suele tardar unos segundos.</p>
    <p class="error" id="error"></p>
    <button id="reintentar" onclick="location.reload()">Reintentar</button>
  </main>
  <script>
    const inicio = Date.now();
    async function comprobar() {
      try {
        const r = await fetch("/__wallo/estado", { cache: "no-store" });
        const e = await r.json();
        if (e.estado === "activa") return location.reload();
        if (e.error && e.estado === "dormida") {
          document.getElementById("error").textContent = e.error;
          document.getElementById("error").style.display = "block";
          document.getElementById("reintentar").style.display = "inline-block";
          return;
        }
      } catch (_) { /* el portal se está reiniciando: seguir esperando */ }
      if (Date.now() - inicio > 20000)
        document.getElementById("texto").textContent = "Está tardando más de lo normal. Sigue esperando…";
      setTimeout(comprobar, 1000);
    }
    setTimeout(comprobar, 800);
  </script>
</body>
</html>
